services:
  postgres:
    image: postgres:17-alpine
    container_name: plantilla-back-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: plantilla_back
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plantilla_back"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plantilla-back-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 3500
      HOST_DB: postgres
      PORT_DB: 5432
      USERNAME_DB: postgres
      PASSWORD_DB: postgres
      DATABASE_DB: plantilla_back
      ADMIN_SEED_ENABLED: "true"
      ADMIN_SEED_NAME: Admin
      ADMIN_SEED_USERNAME: admin@local.dev
      ADMIN_SEED_PASSWORD: Admin123
      JWT_SEED: MarianiitaSecretSeed
    ports:
      - "3500:3500"

volumes:
  postgres_data:
    name: plantilla-back-postgres-data-local
